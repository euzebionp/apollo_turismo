<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel — Expresso Apollo Turismo</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/logo-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/logo-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noite:#0c1f5e; --noite-2:#1b3fae; --sol:#d3141c; --sol-hover:#e8222b; --sol-escuro:#a50f16; --fundo:#f4f6fb;
  --tinta:#141b33; --tinta-2:#525b74; --linha:#dfe3ee; --ok:#15803d; --erro:#b91c1c; --aviso:#b45309;
  --display:'Barlow Condensed',system-ui,sans-serif; --texto:'Inter',system-ui,sans-serif;
  --tricolor:linear-gradient(180deg,#d3141c 0 45%,#fff 45% 60%,#1b3fae 60% 100%);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--texto);background:var(--fundo);color:var(--tinta);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{width:min(1200px,100% - 32px);margin-inline:auto}
header{background:var(--noite);color:#fff;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;background:var(--tricolor);z-index:1}
header .wrap{display:flex;align-items:center;gap:1.5rem;height:60px}
.marca{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:1.3rem;display:flex;align-items:center;gap:.55rem;line-height:1}
.marca img{width:38px;height:38px;border-radius:50%;background:#fff}
.marca span{color:#ff6b70}
nav{display:flex;gap:4px;margin-left:auto}
nav button{border:0;background:transparent;color:#c6cde0;padding:.5rem .9rem;border-radius:10px;font-weight:600}
nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
nav .badge{background:var(--sol);color:#fff;border-radius:999px;padding:0 .45rem;font-size:.75rem;margin-left:.3rem}
.sair{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;padding:.4rem .8rem}
main{padding:36px 0 60px}
h1{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:2.2rem;letter-spacing:.005em;line-height:1;margin:0;color:var(--noite)}
h2{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:1.45rem;margin:0;color:var(--noite)}
.cabeca{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.sub{color:var(--tinta-2);margin:.2rem 0 0}
.btn{border:0;border-radius:12px;padding:.65rem 1rem;font-weight:600;display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;white-space:nowrap}
.btn-sol{background:var(--sol);color:#fff}
.btn-sol:hover:not([disabled]){background:var(--sol-hover)}
.btn-noite{background:var(--noite);color:#fff}
.btn-borda{background:#fff;border:1px solid var(--linha);color:var(--tinta)}
.btn-perigo{background:#fff;border:1px solid #fecaca;color:var(--erro)}
.btn-mini{padding:.35rem .65rem;font-size:.85rem;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.cartao{background:#fff;border:1px solid var(--linha);border-radius:16px}
.resumo-num{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:1.25rem}
.resumo-num .cartao{padding:1rem 1.1rem}
.resumo-num small{color:var(--tinta-2);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.resumo-num strong{display:block;font-family:var(--display);font-size:1.6rem}
.tabela-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.75rem .9rem;border-bottom:1px solid var(--linha);vertical-align:middle}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2);font-weight:600;background:#faf8f4}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.titulo-viagem{font-weight:600}
.titulo-viagem small{display:block;color:var(--tinta-2);font-weight:400}
.ocup{min-width:140px}
.ocup .barra{height:8px;background:#efebe3;border-radius:99px;overflow:hidden;margin-top:4px}
.ocup .barra i{display:block;height:100%;background:var(--sol)}
.pill{display:inline-block;white-space:nowrap;font-size:.75rem;font-weight:700;padding:.15rem .55rem;border-radius:99px;letter-spacing:.02em}
.p-CONFIRMADO,.p-APROVADO,.p-ativa{background:#dcfce7;color:var(--ok)}
.p-PENDENTE,.p-AGUARDANDO{background:#fef3c7;color:var(--aviso)}
.p-EXPIRADO,.p-CANCELADO,.p-inativa{background:#f1f5f9;color:#475569}
.p-ESTORNAR,.p-DIVERGENTE{background:#fee2e2;color:var(--erro)}
.p-ESTORNADO{background:#e0e7ff;color:#3730a3}
.vazio{padding:2rem;text-align:center;color:var(--tinta-2)}
.voltar{border:0;background:none;color:var(--tinta-2);padding:0;margin-bottom:.5rem;font-weight:600}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
select,input[type=text],input[type=number],input[type=datetime-local],input[type=url],input[type=password],textarea{border:1px solid var(--linha);border-radius:10px;padding:.6rem .75rem;background:#fff;color:var(--tinta);width:100%}
select{width:auto}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--noite);box-shadow:0 0 0 3px rgba(20,33,61,.1)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--noite) url('/img/banner.webp') center/cover no-repeat;position:relative}
.login::before{content:"";position:absolute;inset:0;background:rgba(12,31,94,.78)}
.login::after{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--tricolor)}
.login .cartao{position:relative;z-index:1}
.login .logo-login{display:block;width:110px;height:110px;border-radius:50%;margin:0 auto .5rem;background:#fff}
.login .cartao{width:min(400px,100%);padding:2rem}
.login h1{margin-bottom:.4rem}
.login label{display:block;font-weight:600;margin:1.2rem 0 .35rem}
.login .btn{width:100%;justify-content:center;margin-top:1rem}
.erro{color:var(--erro);font-size:.88rem;margin-top:.5rem;min-height:1.2em}
/* editor */
.editor{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:960px){.editor{grid-template-columns:1.1fr 1fr}}
.bloco{padding:1.25rem}
.bloco h2{margin-bottom:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo{margin-bottom:.9rem}
.campo label{display:block;font-weight:600;font-size:.88rem;margin-bottom:.3rem}
.campo .ajuda{font-size:.8rem;color:var(--tinta-2);margin-top:.25rem}
.campo[data-erro] input,.campo[data-erro] textarea{border-color:var(--erro)}
.campo .msg{color:var(--erro);font-size:.8rem;margin-top:.25rem;display:none}
.campo[data-erro] .msg{display:block}
.moeda{position:relative}
.moeda span{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--tinta-2)}
.moeda input{padding-left:2.3rem}
.toggle{display:flex;align-items:center;gap:.6rem;font-weight:600}
.toggle input{width:20px;height:20px}
.dia-ed{border:1px solid var(--linha);border-radius:12px;padding:.8rem;margin-bottom:10px;background:#fcfbf8}
.dia-ed .topo{display:flex;gap:8px;align-items:center;margin-bottom:.6rem}
.dia-ed .topo b{flex:none;font-family:var(--display);width:52px}
.item-ed{display:grid;grid-template-columns:90px 1fr auto;gap:6px;margin-bottom:6px}
.grade-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.foto-card{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.foto-card .thumb{position:relative;aspect-ratio:4/3;background:#efebe3}
.foto-card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.foto-card .selo-capa{position:absolute;top:6px;left:6px;background:var(--sol);color:#fff;font-size:.7rem;font-weight:800;padding:.1rem .45rem;border-radius:6px;text-transform:uppercase}
.foto-card .estado{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,33,61,.55);color:#fff;font-size:.82rem;font-weight:600;text-align:center;padding:8px}
.foto-card .estado.erro{background:rgba(185,28,28,.8)}
.foto-card input{border:0;border-top:1px solid var(--linha);border-radius:0;font-size:.85rem;padding:.5rem .6rem}
.foto-card .barra-acoes{display:flex;border-top:1px solid var(--linha)}
.foto-card .barra-acoes button{flex:1;border:0;background:#fff;padding:.4rem;color:var(--tinta-2);font-size:.85rem}
.foto-card .barra-acoes button:hover:not([disabled]){background:#f6f3ec;color:var(--tinta)}
.foto-card .barra-acoes button+button{border-left:1px solid var(--linha)}
.soltar{border:2px dashed var(--linha);border-radius:12px;padding:1rem;text-align:center;color:var(--tinta-2);font-size:.88rem;transition:border-color .15s,background .15s}
.soltar.ativo{border-color:var(--sol);background:#fff1f2}
.soltar .btn{margin:.4rem .2rem 0}
.soltar small{display:block;margin-top:.4rem;font-size:.78rem}
.cat{margin-bottom:1rem}
.cat h3{font-size:.9rem;margin:.2rem 0 .5rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2)}
.x{border:0;background:#f1ede4;border-radius:8px;width:34px;height:34px;color:var(--tinta-2)}
.barra-salvar{position:sticky;bottom:0;background:rgba(245,243,238,.95);backdrop-filter:blur(6px);padding:12px 0;margin-top:16px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--linha)}
.aviso-box{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:.75rem 1rem;font-size:.88rem;color:#78350f;margin-bottom:1rem}
/* manifesto */
.colunas{display:flex;flex-wrap:wrap;gap:8px 16px;margin:.5rem 0 1rem}
.colunas label{display:flex;gap:.4rem;align-items:center;font-size:.9rem}
.toast{opacity:0;visibility:hidden;position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--noite);color:#fff;padding:.75rem 1.1rem;border-radius:12px;font-weight:600;transition:transform .25s;z-index:50;max-width:calc(100% - 32px)}
.toast.visivel{transform:translateX(-50%);opacity:1;visibility:visible}
.toast.erro{background:var(--erro)}
[hidden]{display:none!important}
.perms{display:grid;gap:8px;margin:.4rem 0 1rem}
.perms label{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .75rem;border:1px solid var(--linha);border-radius:10px;cursor:pointer;font-size:.92rem}
.perms label:has(input:checked){border-color:var(--noite);background:#f3f5fa}
.perms input{margin-top:.2rem;width:18px;height:18px;flex:none}
.perms code{display:block;font-size:.75rem;color:var(--tinta-2)}
.p-MASTER{background:var(--noite);color:#fff}.p-OPERADOR{background:#eef2ff;color:#3730a3}
.chips-perm{display:flex;flex-wrap:wrap;gap:4px}.chips-perm span{font-size:.72rem;background:#f1ede4;border-radius:6px;padding:.1rem .4rem}
.modal-fundo{position:fixed;inset:0;background:rgba(20,33,61,.5);display:grid;place-items:center;z-index:40;padding:16px}
.modal-fundo .cartao{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:1.4rem}
.estreito{max-width:440px}
header nav{overflow-x:auto}
.p-RASCUNHO{background:#f1f5f9;color:#475569}.p-PUBLICADA{background:#dcfce7;color:var(--ok)}.p-CONCLUIDA{background:#e0e7ff;color:#3730a3}.p-CANCELADA{background:#fee2e2;color:var(--erro)}
.p-DESIST{background:#ffedd5;color:#c2410c}
.mais{font-size:.85rem;padding:.35rem .5rem;border-radius:9px}
.valores3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1rem}
.valores3 .cartao{padding:.9rem 1rem}.valores3 small{color:var(--tinta-2);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.valores3 strong{display:block;font-family:var(--display);font-size:1.4rem}
.ok-txt{color:var(--ok)}.erro-txt{color:var(--erro)}
.ponto-ed{display:grid;grid-template-columns:1.2fr 1.2fr 190px auto;gap:6px;margin-bottom:6px}
@media(max-width:700px){.ponto-ed{grid-template-columns:1fr 1fr}}
.mini-mapa{display:inline-block;background:#faf8f4;border:1px solid var(--linha);border-radius:16px 16px 8px 8px;padding:8px}
.mini-mapa .fil{display:grid;gap:4px;margin-bottom:4px}
.mini-mapa button{width:30px;height:30px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;font-size:.72rem;font-weight:700;padding:0}
.mini-mapa button.bloq{background:#1b1f2a;color:#fff;border-color:#1b1f2a}
.mini-mapa button.oc{background:var(--sol);border-color:var(--sol);color:#fff}
.grupo-embarque{margin-bottom:16px}
.grupo-embarque h2{display:flex;justify-content:space-between;gap:1rem;padding:1rem 1rem .5rem}
.fila li{display:flex;align-items:center;gap:.75rem;padding:.6rem .9rem;border-bottom:1px solid var(--linha)}
.fila{list-style:none;margin:0;padding:0}
.fila li.feita{opacity:.55}
.fila li .nome{flex:1}
.msg-previa{white-space:pre-wrap;background:#f6f3ec;border-radius:10px;padding:.75rem;font-size:.88rem;margin:.5rem 0 1rem}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;gap:.4rem;align-items:center;border:1px solid var(--linha);border-radius:10px;padding:.5rem .75rem;cursor:pointer;font-weight:600;font-size:.9rem}
.radios label:has(input:checked){border-color:var(--noite);background:#f3f5fa}
@media(max-width:820px){header .wrap{height:auto;flex-wrap:wrap;padding:10px 0;gap:.6rem}nav{margin-left:0;order:3;width:100%}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="tela-login">
  <form class="cartao" id="form-login">
    <img class="logo-login" src="/img/logo-192.png" width="110" height="110" alt="Expresso Apollo Turismo">
    <h1 style="margin-top:.5rem;text-align:center">Painel administrativo</h1>
    <p class="sub" style="text-align:center">Acesso restrito à equipe da agência.</p>
    <label for="login-usuario">Usuário</label>
    <input type="text" id="login-usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="login-senha">Senha</label>
    <input type="password" id="login-senha" autocomplete="current-password" required>
    <div class="erro" id="login-erro" role="alert"></div>
    <button class="btn btn-noite" type="submit">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="tela-app" hidden>
  <header>
    <div class="wrap">
      <div class="marca"><img src="/img/logo-64.png" width="38" height="38" alt="">Expresso Apollo <span>Painel</span></div>
      <nav>
        <button type="button" data-nav="viagens" aria-current="page">Viagens</button>
        <button type="button" data-nav="cobrancas" data-perm="financeiro.ver">Cobranças</button>
        <button type="button" data-nav="pendencias" data-perm="financeiro.ver">Pendências <span class="badge" id="badge-pend" hidden>0</span></button>
        <button type="button" data-nav="usuarios" data-perm="usuarios.gerenciar">Usuários</button>
        <button type="button" data-nav="auditoria" data-perm="auditoria.ver">Atividades</button>
      </nav>
      <button class="sair" type="button" id="btn-conta" title="Minha senha"><span id="nome-usuario"></span></button>
      <button class="sair" type="button" id="btn-sair">Sair</button>
    </div>
  </header>
  <main class="wrap" id="conteudo"></main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reais = (c) => (Number(c || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const tz = { timeZone: 'America/Sao_Paulo' };
  const dataHora = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { ...tz, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  const dataCurta = (iso) => iso ? new Date(iso).toLocaleDateString('pt-BR', { ...tz, day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
  const sess = {
    get() { try { return sessionStorage.getItem('apollo_admin') || ''; } catch { return estado.tokenMem || ''; } },
    set(v) { estado.tokenMem = v; try { sessionStorage.setItem('apollo_admin', v); } catch {} },
    del() { estado.tokenMem = ''; try { sessionStorage.removeItem('apollo_admin'); } catch {} },
  };
  const estado = { tokenMem: '', viagens: [], tela: 'viagens', me: null };
  const pode = (p) => !!estado.me?.permissoes?.includes(p);

  function toast(msg, erro = false) {
    const t = $('#toast');
    t.textContent = msg; t.classList.toggle('erro', erro); t.classList.add('visivel');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('visivel'), 3200);
  }

  async function api(path, opts = {}) {
    const res = await fetch('/api/admin' + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${sess.get()}`, ...(opts.headers || {}) },
    });
    if (res.status === 401) { sess.del(); mostrarLogin('Sessão expirada. Entre novamente.'); throw new Error('401'); }
    const json = await res.json().catch(() => ({ ok: false, erro: { mensagem: 'Resposta inválida' } }));
    if (res.status === 403 && json.erro?.codigo === 'TROCAR_SENHA') { telaMinhaSenha(true); throw new Error('TROCAR_SENHA'); }
    return { status: res.status, json };
  }

  // ---------- login ----------
  function mostrarLogin(msg = '') {
    $('#tela-app').hidden = true; $('#tela-login').hidden = false;
    $('#login-erro').textContent = msg; $('#login-usuario').focus();
  }
  async function entrarNoApp() {
    const r = await api('/me');
    if (!r.json.ok) return mostrarLogin();
    estado.me = r.json.data.usuario;
    estado.catalogo = r.json.data.catalogo;
    fetch('/api/config').then((x) => x.json()).then((j) => { estado.agencia = j.data?.agencia_nome; }).catch(() => {});
    $('#nome-usuario').textContent = estado.me.nome.split(' ')[0];
    $$('[data-perm]').forEach((el) => (el.hidden = !pode(el.dataset.perm)));
    $('#tela-login').hidden = true; $('#tela-app').hidden = false;
    if (estado.me.trocar_senha) return telaMinhaSenha(true);
    navegar('viagens');
  }
  $('#form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#login-erro').textContent = '';
    const btn = $('#form-login button'); btn.disabled = true;
    try {
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario: $('#login-usuario').value, senha: $('#login-senha').value }) });
      const json = await res.json().catch(() => ({}));
      if (!json.ok) { $('#login-erro').textContent = json.erro?.mensagem || 'Falha ao entrar'; return; }
      sess.set(json.data.token);
      $('#login-senha').value = '';
      await entrarNoApp();
    } catch { $('#login-erro').textContent = 'Sem conexão com o servidor.'; }
    finally { btn.disabled = false; }
  });
  $('#btn-sair').addEventListener('click', async () => { await api('/logout', { method: 'POST' }).catch(() => {}); sess.del(); estado.me = null; mostrarLogin(); });
  $('#btn-conta').addEventListener('click', () => telaMinhaSenha(false));

  $$('[data-nav]').forEach((b) => b.addEventListener('click', () => navegar(b.dataset.nav)));
  function navegar(tela, arg) {
    estado.tela = tela;
    const ativa = ['pendencias', 'usuarios', 'auditoria', 'cobrancas'].includes(tela) ? tela : 'viagens';
    $$('[data-nav]').forEach((b) => b.dataset.nav === ativa ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    window.scrollTo(0, 0);
    if (tela === 'viagens') return telaViagens();
    if (tela === 'cobrancas') return telaCobrancas();
    if (tela === 'embarque') return telaEmbarque(arg);
    if (tela === 'mensagens') return telaMensagens(arg);
    if (tela === 'financeiro') return telaFinanceiro(arg);
    if (tela === 'pendencias') return telaPendencias();
    if (tela === 'editar') return telaEditor(arg);
    if (tela === 'reservas') return telaReservas(arg);
    if (tela === 'manifesto') return telaManifesto(arg);
    if (tela === 'usuarios') return telaUsuarios();

  function formDuplicar(v) {
    const m = modal(`
      <h2>Duplicar "${esc(v.titulo)}"</h2>

      <form id="f-dup" novalidate style="margin-top:1rem">
        <div class="campo" data-campo="data_partida"><label>Nova data e hora de saída</label><input type="datetime-local" name="partida"><div class="msg"></div></div>

        <div class="acoes" style="justify-content:flex-end"><button class="btn btn-borda" type="button" data-fechar-modal>Cancelar</button><button class="btn btn-sol" type="submit">Criar cópia</button></div>
      </form>`);
    $('#f-dup', m).addEventListener('input', (e) => { if (e.target.name === 'id') e.target.value = slug(e.target.value); });
    $('#f-dup', m).addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const r = await api(`/viagens/${encodeURIComponent(v.id)}/duplicar`, { method: 'POST', body: JSON.stringify({ id: f.id.value, data_partida: f.partida.value ? new Date(f.partida.value).toISOString() : '' }) });
      if (!r.json.ok) { errosCampos(f, r.json.erro?.campos); return toast(r.json.erro?.mensagem || 'Erro', true); }
      m.remove(); toast('Cópia criada como rascunho. Confira e publique.'); navegar('editar', r.json.data.id);

    const m = modal(`

  async function concluirViagem(v) {
    if (!confirm(`Marcar "${v.titulo}" como concluída? Ela sai das listas de cobrança.`)) return;
    const r = await api(`/viagens/${encodeURIComponent(v.id)}/concluir`, { method: 'POST' });

    toast('Viagem concluída.'); telaViagens();
  }

  // ---------- editor de viagem ----------
  const paraInputLocal = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const centavos = (txt) => {
    const s = String(txt || '').trim().replace(/\./g, '').replace(',', '.');
    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) : NaN;
  };
  const paraMoeda = (c) => (c / 100).toFixed(2).replace('.', ',');
  const slug = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 64);

    let poltronasReservadas = new Set();
    if (id && pode('reservas.ver') && v.layout) {
      api(`/viagens/${encodeURIComponent(id)}/reservas`).then((r) => {
        poltronasReservadas = new Set((r.json.data || []).filter((x) => x.status === 'CONFIRMADO' || (x.status === 'PENDENTE' && x.expira_em > new Date().toISOString())).map((x) => x.poltrona).filter(Boolean));
        renderMiniMapa();
      }).catch(() => {});
    }

    function renderPontos() {
      $('#pontos').innerHTML = pontos.map((p, i) => `<div class="ponto-ed">
        <input type="text" data-ponto="${i}" data-k="nome" value="${esc(p.nome)}" placeholder="Nome (ex.: Rodoviária)" maxlength="120">
        <input type="text" data-ponto="${i}" data-k="endereco" value="${esc(p.endereco || '')}" placeholder="Endereço / referência" maxlength="200">
        <input type="datetime-local" data-ponto="${i}" data-k="horario" value="${paraInputLocal(p.horario)}" aria-label="Horário">
        <button class="x" type="button" data-rm-ponto="${i}" aria-label="Remover ponto">×</button></div>`).join('') || '<p class="sub" style="font-size:.88rem">Nenhum ponto cadastrado.</p>';
    }
    const COLS_MAPA = { '2-2': [2, 2], '2-1': [2, 1], '1-1': [1, 1] };
    function renderMiniMapa() {
      const usa = $('#e-usa-mapa')?.checked;
      $('#e-mapa-opcoes').hidden = !usa;
      const vagasInput = $('#e-vagas');
      if (usa) {
        layout.bloqueadas = layout.bloqueadas.filter((n) => n <= layout.poltronas);
        const vendaveis = layout.poltronas - layout.bloqueadas.length;
        vagasInput.value = vendaveis; vagasInput.disabled = true;
        $('#e-vagas-ajuda').textContent = `Calculado pelo mapa: ${layout.poltronas} poltronas − ${layout.bloqueadas.length} bloqueada(s).`;
      } else {
        vagasInput.disabled = !pode('viagens.editar');
        $('#e-vagas-ajuda').textContent = ocupacao ? `Mínimo ${ocupacao} (já ocupadas)` : '';
        return;
      }
      const [esq, dir] = COLS_MAPA[layout.tipo];
      const bloq = new Set(layout.bloqueadas);
      const cols = `${'30px '.repeat(esq)}12px ${'30px '.repeat(dir)}`;
      let html = '<div class="mini-mapa">';
      for (let ini = 1; ini <= layout.poltronas; ini += esq + dir) {
        const cel = [];
        for (let k = 0; k < esq + dir; k++) {
          if (k === esq) cel.push('<span></span>');
          const n = ini + k;
          cel.push(n > layout.poltronas ? '<span></span>'
            : `<button type="button" data-bloq="${n}" class="${bloq.has(n) ? 'bloq' : poltronasReservadas.has(n) ? 'oc' : ''}" title="${poltronasReservadas.has(n) ? 'Reservada' : bloq.has(n) ? 'Bloqueada — clique para liberar' : 'Clique para bloquear'}">${n}</button>`);
        }
        html += `<div class="fil" style="grid-template-columns:${cols}">${cel.join('')}</div>`;
      }
      $('#e-mini-mapa').innerHTML = html + '</div>';
    }

    function renderDias() {
      $('#dias').innerHTML = prog.map((d, i) => `
        <div class="dia-ed">
          <div class="topo"><b>Dia ${i + 1}</b><input type="text" data-dia="${i}" data-k="titulo" value="${esc(d.titulo)}" placeholder="Título do dia"><button class="x" type="button" data-rm-dia="${i}" aria-label="Remover dia">×</button></div>
          ${(d.itens || []).map((it, j) => `<div class="item-ed">
            <input type="text" data-dia="${i}" data-item="${j}" data-k="hora" value="${esc(it.hora)}" placeholder="08:00" maxlength="5">
            <input type="text" data-dia="${i}" data-item="${j}" data-k="atividade" value="${esc(it.atividade)}" placeholder="Atividade">
            <button class="x" type="button" data-rm-item="${i}:${j}" aria-label="Remover horário">×</button></div>`).join('')}
          <button class="btn btn-borda btn-mini" type="button" data-add-item="${i}">+ Horário</button>
        </div>`).join('') || '<p class="sub">Nenhum dia cadastrado.</p>';
    }
    const CATS = [['veiculo', 'Ônibus'], ['hospedagem', 'Hospedagem'], ['destino', 'Destino']];
    let enviando = 0;
    function atualizarSalvar() { const b = $('#salvar'); if (b) { b.disabled = enviando > 0; b.textContent = enviando > 0 ? `Enviando ${enviando} foto(s)…` : (criando ? 'Criar viagem' : 'Salvar alterações'); } }
    function renderFotos() {
      $('#fotos').innerHTML = CATS.map(([k, n]) => `
        <div class="cat" data-zona="${k}"><h3>${n}${k === 'destino' ? ' <small style="text-transform:none;letter-spacing:0;font-weight:500">(a 1ª vira a capa da página)</small>' : ''}</h3>
          ${fotos[k].length ? `<div class="grade-fotos">${fotos[k].map((f, i) => `
            <div class="foto-card">
              <div class="thumb">
                <img src="${esc(f._previa || f.url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                ${k === 'destino' && i === 0 ? '<span class="selo-capa">Capa</span>' : ''}
                ${f._enviando ? '<div class="estado">Enviando…</div>' : ''}
                ${f._erro ? `<div class="estado erro">${esc(f._erro)}</div>` : ''}
              </div>
              <input type="text" data-cat="${k}" data-i="${i}" data-k="legenda" value="${esc(f.legenda)}" placeholder="Legenda (opcional)" maxlength="120" ${f._erro ? 'disabled' : ''}>
              <div class="barra-acoes">
                <button type="button" data-mover="${k}:${i}:-1" ${i === 0 || f._enviando ? 'disabled' : ''} aria-label="Mover para a esquerda" title="Mover para a esquerda">◀</button>
                <button type="button" data-mover="${k}:${i}:1" ${i === fotos[k].length - 1 || f._enviando ? 'disabled' : ''} aria-label="Mover para a direita" title="Mover para a direita">▶</button>
                <button type="button" data-rm-foto="${k}:${i}" ${f._enviando ? 'disabled' : ''} aria-label="Remover foto" title="Remover">✕</button>
              </div>
            </div>`).join('')}</div>` : ''}
          ${pode('viagens.editar') ? `<div class="soltar" data-soltar="${k}">
            Arraste as fotos aqui<br>
            <label class="btn btn-noite btn-mini" style="cursor:pointer">Escolher fotos do computador<input type="file" accept=".jpg,.jpeg,.png,.webp,.gif,.avif,.bmp,.heic,.heif,image/jpeg,image/png,image/webp,image/gif,image/avif,image/bmp,image/heic,image/heif" multiple hidden data-arquivos="${k}"></label>
            <button class="btn btn-borda btn-mini" type="button" data-link-foto="${k}">Usar link da internet</button>
            <small>JPG, PNG, WebP, GIF, AVIF ou BMP · várias de uma vez · HEIC: use o Safari ou converta para JPG</small>
          </div>` : ''}
        </div>`).join('');
      atualizarSalvar();
    }

    // Formatos que os navegadores modernos conseguem abrir. Tudo é convertido
    // para WebP (ou JPEG) antes do envio, para o site exibir em qualquer navegador.
    const TIPO_ACEITO = /^image\/(jpeg|png|webp|gif|avif|bmp)$/i;
    const EXT_ACEITA = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;
    const TIPO_HEIC = /^image\/hei[cf]$/i;
    const EXT_HEIC = /\.(heic|heif)$/i;
    const temExt = (f, re) => re.test(f.name || '');
    const ehHeic = (f) => TIPO_HEIC.test(f.type || '') || temExt(f, EXT_HEIC);
    const ehImagemAceita = (f) => TIPO_ACEITO.test(f.type || '') || temExt(f, EXT_ACEITA);

    function erroDeFormato(arquivo) {
      if (ehHeic(arquivo)) return 'HEIC não é compatível com este navegador. Converta para JPG/PNG (ou envie pelo Safari).';
      if (/^image\//i.test(arquivo.type || '')) return 'Formato de imagem não compatível. Use JPG, PNG, WebP, GIF ou AVIF.';
      return 'O arquivo selecionado não é uma imagem compatível. Use JPG, PNG, WebP, GIF ou AVIF.';
    }

    // Reduz a imagem no navegador: máx. 1920 px no lado maior, WebP (ou JPEG), até ~1,5 MB.
    async function carregarImagem(arquivo) {
      try { return await createImageBitmap(arquivo, { imageOrientation: 'from-image' }); } catch {}
      return new Promise((ok, erro) => {
        const img = new Image(), u = URL.createObjectURL(arquivo);
        img.onload = () => { URL.revokeObjectURL(u); ok(img); };
        img.onerror = () => { URL.revokeObjectURL(u); erro(new Error('formato')); };
        img.src = u;
      });
    }
    async function reduzir(arquivo) {
      let img;
      try { img = await carregarImagem(arquivo); }
      catch { throw new Error(erroDeFormato(arquivo)); }
      const w = img.width, h = img.height;
      if (!w || !h) { if (img.close) img.close(); throw new Error(erroDeFormato(arquivo)); }
      const escala = Math.min(1, 1920 / Math.max(w, h));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * escala); canvas.height = Math.round(h * escala);
      const ctx = canvas.getContext('2d');
      if (!ctx) { if (img.close) img.close(); throw new Error('Este navegador não conseguiu processar a imagem.'); }
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      if (img.close) img.close();
      const gerar = (tipo, q) => new Promise((ok) => canvas.toBlob(ok, tipo, q));
      let tipo = 'image/webp', q = 0.82, blob = await gerar(tipo, q);
      if (!blob || blob.type !== 'image/webp') { tipo = 'image/jpeg'; blob = await gerar(tipo, 0.85); q = 0.85; }
      while (blob && blob.size > 1_500_000 && q > 0.4) { q -= 0.1; blob = await gerar(tipo, q); }
      if (!blob) throw new Error('Não foi possível converter a imagem. Tente outro arquivo.');
      return blob;
    }
    async function enviarArquivos(cat, lista) {
      const selecionados = [...lista];
      // Aceita os formatos que o navegador abre. HEIC entra na lista para o Safari
      // (que consegue abrir); nos demais navegadores o erro explica o que fazer.
      const arquivos = selecionados.filter((f) => ehImagemAceita(f) || ehHeic(f));
      const ignorados = selecionados.length - arquivos.length;
      if (ignorados) toast(`${ignorados} arquivo(s) ignorado(s): use imagens JPG, PNG, WebP, GIF ou AVIF.`, true);
      if (!arquivos.length) { if (!ignorados) toast('Selecione arquivos de imagem.', true); return; }
      const itens = arquivos.map((a) => ({ url: '', legenda: '', _enviando: true, _previa: URL.createObjectURL(a), _arquivo: a }));
      fotos[cat].push(...itens);
      enviando += itens.length;
      renderFotos();
      for (const item of itens) {
        try {
          const blob = await reduzir(item._arquivo);
          const res = await fetch('/api/admin/fotos', {
            method: 'POST',
            headers: { Authorization: `Bearer ${sess.get()}`, 'Content-Type': blob.type, 'X-Nome-Arquivo': encodeURIComponent(item._arquivo.name) },
            body: blob,
          });
          if (res.status === 401) { sess.del(); mostrarLogin('Sessão expirada. Entre novamente.'); return; }
          const json = await res.json().catch(() => ({}));
          if (!json.ok) throw new Error(json.erro?.mensagem || 'Falha no envio');
          item.url = json.data.url;
          const previaLocal = item._previa;
          item._previa = json.data.url;
          if (previaLocal) URL.revokeObjectURL(previaLocal);
        } catch (err) {
          item._erro = err.message;
        } finally {
          item._enviando = false;
          delete item._arquivo;
          enviando--;
          if ($('#fotos')) renderFotos();
        }
      }
      const erros = itens.filter((i) => i._erro).length;
      if (erros) toast(`${erros} foto(s) não foram enviadas. Remova-as e tente de novo.`, true);
      else toast(`${itens.length} foto(s) enviada(s). Clique em salvar para publicar.`);
    }

    renderDias(); renderFotos(); renderPontos(); renderMiniMapa();
    if (!pode('viagens.editar')) {
      $$('#form-viagem input, #form-viagem textarea, #form-viagem button').forEach((el) => {
        if (!['e-sinal', 'e-integral', 'salvar', 'cancelar'].includes(el.id)) el.disabled = true;
      });
    }
    if (!pode('precos.alterar')) { $('#e-sinal').disabled = true; $('#e-integral').disabled = true; }

    const form = $('#form-viagem');
    form.addEventListener('input', (e) => {
      const t = e.target;
      if (t.dataset.dia !== undefined) {
        const d = prog[+t.dataset.dia];
        if (t.dataset.item !== undefined) d.itens[+t.dataset.item][t.dataset.k] = t.value; else d[t.dataset.k] = t.value;
      }
      if (t.dataset.cat) { fotos[t.dataset.cat][+t.dataset.i][t.dataset.k] = t.value; }
      if (t.dataset.ponto !== undefined) { const p = pontos[+t.dataset.ponto]; p[t.dataset.k] = t.dataset.k === 'horario' ? (t.value ? new Date(t.value).toISOString() : null) : t.value; }
      if (t.id === 'e-layout-qtd') { const n = Math.max(1, Math.min(200, Number(t.value) || 1)); layout.poltronas = n; renderMiniMapa(); }
      if (t.id === 'e-titulo' && criando && !$('#e-id').dataset.mexido) { $('#e-id').value = slug(t.value); $('#e-id-prev').textContent = $('#e-id').value || '…'; }
      if (t.id === 'e-id') { t.dataset.mexido = '1'; t.value = slug(t.value); $('#e-id-prev').textContent = t.value || '…'; }
    });
    form.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.arquivos && t.files?.length) { enviarArquivos(t.dataset.arquivos, t.files); t.value = ''; }
      if (t.id === 'e-usa-mapa' || t.id === 'e-layout-tipo') { layout.tipo = $('#e-layout-tipo').value; renderMiniMapa(); }
    });
    const zonaDe = (e) => e.target.closest?.('[data-soltar]');
    form.addEventListener('dragover', (e) => { const z = zonaDe(e); if (z && pode('viagens.editar')) { e.preventDefault(); z.classList.add('ativo'); } });
    form.addEventListener('dragleave', (e) => { const z = zonaDe(e); if (z) z.classList.remove('ativo'); });
    form.addEventListener('drop', (e) => {
      const z = zonaDe(e); if (!z) return;
      e.preventDefault(); z.classList.remove('ativo');
      if (pode('viagens.editar') && e.dataTransfer?.files?.length) enviarArquivos(z.dataset.soltar, e.dataTransfer.files);
    });
    form.addEventListener('click', (e) => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.id === 'add-ponto') {
        const base = $('#e-partida').value ? new Date($('#e-partida').value).toISOString() : null;
        pontos.push({ id: '', nome: '', endereco: '', horario: base }); renderPontos();
        $$('#pontos [data-k="nome"]').pop()?.focus();
      }
      if (t.dataset.rmPonto) { pontos.splice(+t.dataset.rmPonto, 1); renderPontos(); }
      if (t.dataset.bloq) {
        const n = +t.dataset.bloq;
        if (poltronasReservadas.has(n)) return toast(`A poltrona ${n} tem reserva e não pode ser bloqueada.`, true);
        const i = layout.bloqueadas.indexOf(n);
        if (i >= 0) layout.bloqueadas.splice(i, 1); else layout.bloqueadas.push(n);
        renderMiniMapa();
      }
      if (t.dataset.sinalPct) {
        const integral = centavos($('#e-integral').value);
        if (!Number.isFinite(integral) || integral <= 0) return toast('Preencha primeiro o preço integral.', true);
        $('#e-sinal').value = paraMoeda(Math.round(integral * Number(t.dataset.sinalPct) / 100));
      }
      if (t.id === 'add-dia') { prog.push({ dia: prog.length + 1, titulo: '', itens: [{ hora: '', atividade: '' }] }); renderDias(); }
      if (t.dataset.rmDia) { prog.splice(+t.dataset.rmDia, 1); renderDias(); }
      if (t.dataset.addItem) { prog[+t.dataset.addItem].itens.push({ hora: '', atividade: '' }); renderDias(); }
      if (t.dataset.rmItem) { const [i, j] = t.dataset.rmItem.split(':').map(Number); prog[i].itens.splice(j, 1); renderDias(); }
      if (t.dataset.linkFoto) {
        const url = (prompt('Cole o link da imagem (começando com https://):') || '').trim();
        if (!url) return;
        if (!/^https:\/\/\S+$/.test(url)) return toast('O link precisa começar com https://', true);
        fotos[t.dataset.linkFoto].push({ url, legenda: '' }); renderFotos();
      }
      if (t.dataset.rmFoto) { const [k, i] = t.dataset.rmFoto.split(':'); const [f] = fotos[k].splice(+i, 1); if (f?._previa) URL.revokeObjectURL(f._previa); renderFotos(); }
      if (t.dataset.mover) {
        const [k, i, d] = t.dataset.mover.split(':'); const a = +i, b = a + +d;
        if (b < 0 || b >= fotos[k].length) return;
        [fotos[k][a], fotos[k][b]] = [fotos[k][b], fotos[k][a]]; renderFotos();
      }
    });
    $('#voltar').addEventListener('click', () => navegar('viagens'));
    $('#cancelar').addEventListener('click', () => navegar('viagens'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (enviando > 0) return toast('Aguarde o envio das fotos terminar.', true);
      const partida = $('#e-partida').value, retorno = $('#e-retorno').value;
      const payload = {
        id: criando ? $('#e-id').value : v.id,
        titulo: $('#e-titulo').value,
        destino: $('#e-destino').value,
        descricao: $('#e-desc').value,
        data_partida: partida ? new Date(partida).toISOString() : '',
        data_retorno: retorno ? new Date(retorno).toISOString() : null,
        local_embarque: $('#e-embarque').value,
        total_vagas: Number($('#e-vagas').value),
        preco_sinal_centavos: centavos($('#e-sinal').value),
        preco_integral_centavos: centavos($('#e-integral').value),
        ativa: $('#e-ativa') ? $('#e-ativa').checked : !!v.ativa,
        situacao: $('input[name="situacao"]:checked')?.value || v.situacao,
        layout: $('#e-usa-mapa').checked ? { tipo: layout.tipo, poltronas: layout.poltronas, bloqueadas: layout.bloqueadas } : null,
        pontos_embarque: pontos.filter((p) => p.nome.trim()).map((p) => ({ id: p.id || '', nome: p.nome.trim(), endereco: (p.endereco || '').trim(), horario: p.horario || null })),
        inclusos: $('#e-inclusos').value.split('\n').map((s) => s.trim()).filter(Boolean),
        politica_cancelamento: $('#e-politica').value,
        grupo_whatsapp: $('#e-grupo').value.trim(),
        motorista_nome: $('#e-motorista').value,
        motorista_whatsapp: $('#e-motorista-zap').value,
        veiculo_descricao: $('#e-veiculo').value,
        programacao: prog.map((d, i) => ({ dia: i + 1, titulo: d.titulo.trim(), itens: (d.itens || []).filter((it) => it.atividade.trim()).map((it) => ({ hora: it.hora.trim(), atividade: it.atividade.trim() })) })).filter((d) => d.titulo || d.itens.length),
        fotos: Object.fromEntries(Object.entries(fotos).map(([k, l]) => [k, l.filter((f) => f.url && !f._erro).map((f) => ({ url: f.url.trim(), legenda: (f.legenda || '').trim() }))])),
      };
      // aviso de mudança de preço
      if (!criando && (payload.preco_integral_centavos !== v.preco_integral_centavos || payload.preco_sinal_centavos !== v.preco_sinal_centavos)) {
        if (!confirm(`Confirmar novos preços?\nSinal: ${reais(v.preco_sinal_centavos)} → ${reais(payload.preco_sinal_centavos)}\nIntegral: ${reais(v.preco_integral_centavos)} → ${reais(payload.preco_integral_centavos)}\n\nReservas já feitas mantêm o valor original.`)) return;
      }
      const btn = $('#salvar'); btn.disabled = true;
      const r = await api(criando ? '/viagens' : `/viagens/${encodeURIComponent(v.id)}`, { method: criando ? 'POST' : 'PUT', body: JSON.stringify(payload) }).catch(() => null);
      btn.disabled = false;
      if (!r) return;
      $$('[data-campo]', form).forEach((el) => el.removeAttribute('data-erro'));
      if (!r.json.ok) {
        const campos = r.json.erro?.campos || {};
        Object.entries(campos).forEach(([k, msg]) => { const el = $(`[data-campo="${k}"]`, form); if (el) { el.setAttribute('data-erro', ''); $('.msg', el).textContent = msg; } });
        return toast(r.json.erro?.mensagem || 'Erro ao salvar', true);
      }
      toast(criando ? (payload.situacao === 'RASCUNHO' ? 'Viagem criada como rascunho. Publique quando estiver pronta.' : 'Viagem criada e publicada!') : 'Alterações salvas.');
      navegar('viagens');
    });
  }

  // ---------- reservas ----------
  async function telaReservas(id) {
    const c = $('#conteudo');
    c.innerHTML = '<p class="vazio">Carregando…</p>';
    const v = estado.viagens.find((x) => x.id === id) || { titulo: id };
    const r = await api(`/viagens/${encodeURIComponent(id)}/reservas`);
    const lista = r.json.data || [];
    const filtroAtual = estado.filtroReservas || 'ATIVAS';
    const filtrar = (f) => lista.filter((x) => f === 'TODAS' ? true : f === 'ATIVAS' ? ['PENDENTE', 'CONFIRMADO'].includes(x.status)
      : f === 'DESIST' ? x.desistencia_em && x.status === 'CONFIRMADO' : f === 'DEVENDO' ? x.status === 'CONFIRMADO' && x.saldo_centavos > 0 : x.status === f);
    const verValor = pode('financeiro.ver') || pode('pagamentos.registrar');
    const render = (f) => {
      const itens = filtrar(f);
      $('#tab-res').innerHTML = itens.length ? `<table><thead><tr><th>Código</th><th>Pol.</th><th>Passageiro</th><th>Telefone</th><th>Embarque</th>${verValor ? '<th>Total</th><th>Pago</th><th>Falta</th>' : ''}<th>Reserva</th><th></th></tr></thead><tbody>
        ${itens.map((x) => `<tr>
          <td><code>${esc(x.codigo)}</code></td><td class="num"><b>${esc(x.poltrona ?? '—')}</b></td>
          <td>${esc(x.nome_completo)}<br><small class="num" style="color:var(--tinta-2)">${esc(x.cpf)}</small></td>
          <td class="num"><a href="${esc(zap(x.telefone, ''))}" target="_blank" rel="noopener">${esc(fone(x.telefone))}</a></td>
          <td><small>${esc(x.ponto_embarque_nome || '—')}</small></td>
          ${verValor ? `<td class="num">${reais(x.valor_total_centavos)}</td><td class="num">${x.pago_centavos === null ? '—' : reais(x.pago_centavos)}</td>
            <td class="num ${x.status === 'CONFIRMADO' && x.saldo_centavos ? 'erro-txt' : ''}">${x.status === 'CONFIRMADO' ? (x.saldo_centavos ? reais(x.saldo_centavos) : '<span class="ok-txt">Quitada</span>') : '—'}</td>` : ''}
          <td><span class="pill p-${esc(x.status)}">${esc(x.status)}</span>${x.desistencia_em && x.status === 'CONFIRMADO' ? `<br><span class="pill p-DESIST" title="${esc(x.desistencia_motivo || 'Sem motivo informado')}">Pediu desistência</span>` : ''}</td>
          <td><div class="acoes" style="min-width:150px">
            <button class="btn btn-borda btn-mini" data-copiar-link="${esc(x.id)}" title="Copia o link da página da reserva">Link</button>
            ${x.status === 'CONFIRMADO' && x.saldo_centavos && pode('pagamentos.registrar') ? `<button class="btn btn-borda btn-mini" data-pagar="${esc(x.id)}">Registrar pagamento</button>` : ''}
            ${x.desistencia_em && x.status === 'CONFIRMADO' && pode('reservas.cancelar') ? `<button class="btn btn-perigo btn-mini" data-cancelar="${esc(x.id)}" data-pago="true" data-desist="1">Aprovar desistência</button><button class="btn btn-borda btn-mini" data-recusar="${esc(x.id)}">Recusar</button>`
              : pode('reservas.cancelar') && ['PENDENTE', 'CONFIRMADO'].includes(x.status) ? `<button class="btn btn-perigo btn-mini" data-cancelar="${esc(x.id)}" data-pago="${x.status === 'CONFIRMADO'}">Cancelar</button>` : ''}
          </div></td>
        </tr>`).join('')}</tbody></table>` : '<p class="vazio">Nenhuma reserva neste filtro.</p>';
      $$('[data-cancelar]').forEach((b) => b.addEventListener('click', async () => {
        const pago = b.dataset.pago === 'true';
        const x = lista.find((r) => r.id === b.dataset.cancelar);
        if (b.dataset.desist && !confirm(`Aprovar a desistência de ${x.nome_completo}?\n\nA poltrona é liberada e o que foi pago (${reais(x.pago_centavos || 0)}) vai para Pendências. Você decide quanto devolver conforme a política e faz o estorno.`)) return;
        if (!b.dataset.desist && !confirm(pago ? 'Cancelar esta reserva PAGA? A vaga será liberada e o pagamento irá para Pendências para você fazer o estorno.' : 'Cancelar esta reserva pendente e liberar a vaga?')) return;
        const res = await api(`/reservas/${b.dataset.cancelar}/cancelar`, { method: 'POST' });
        if (!res.json.ok) return toast(res.json.erro?.mensagem || 'Erro', true);
        toast(res.json.data?.estornar ? 'Cancelada. Faça o estorno (veja Pendências).' : 'Reserva cancelada.');
        telaReservas(id);
      }));
      $$('[data-recusar]').forEach((b) => b.addEventListener('click', async () => {
        if (!confirm('Recusar o pedido de desistência? A reserva continua valendo. Avise o passageiro pelo WhatsApp.')) return;
        const res = await api(`/reservas/${b.dataset.recusar}/desistencia/recusar`, { method: 'POST' });
        if (!res.json.ok) return toast(res.json.erro?.mensagem || 'Erro', true);
        toast('Pedido recusado.'); telaReservas(id);
      }));
      $$('[data-pagar]').forEach((b) => b.addEventListener('click', () => formPagamento(lista.find((r) => r.id === b.dataset.pagar), () => telaReservas(id))));
      $$('[data-copiar-link]').forEach((b) => b.addEventListener('click', () => copiar(linkReserva(b.dataset.copiarLink), 'Link da reserva copiado.')));
    };
    const cont = (f) => filtrar(f).length;
    c.innerHTML = `
      <button class="voltar" type="button" id="voltar">← Viagens</button>
      <div class="cabeca"><div><h1>Reservas</h1><p class="sub">${esc(v.titulo)}</p></div>
        ${pode('manifesto.exportar') ? '<button class="btn btn-noite" type="button" id="ir-manifesto">Gerar lista ANTT/DER</button>' : ''}</div>
      <div class="filtros">
        <button class="btn btn-borda btn-mini" type="button" data-ir="embarque">Lista de embarque</button>
        <button class="btn btn-borda btn-mini" type="button" data-ir="mensagens">Mensagens no WhatsApp</button>
        ${pode('financeiro.ver') ? '<button class="btn btn-borda btn-mini" type="button" data-ir="financeiro">Financeiro</button>' : ''}
        <select id="filtro">${[['ATIVAS', 'Ativas'], ['CONFIRMADO', 'Confirmadas'], ['DEVENDO', 'Com saldo a receber'], ['DESIST', 'Pediram desistência'], ['PENDENTE', 'Aguardando Pix'], ['EXPIRADO', 'Expiradas'], ['CANCELADO', 'Canceladas'], ['TODAS', 'Todas']]
          .map(([k, n]) => `<option value="${k}" ${k === filtroAtual ? 'selected' : ''}>${n} (${cont(k)})</option>`).join('')}</select>
      </div>
      <div class="cartao tabela-wrap" id="tab-res"></div>`;
    $('#voltar').addEventListener('click', () => navegar('viagens'));
    $('#ir-manifesto')?.addEventListener('click', () => navegar('manifesto', id));
    $('#filtro').addEventListener('change', (e) => { estado.filtroReservas = e.target.value; render(e.target.value); });
    $$('[data-ir]', c).forEach((b) => b.addEventListener('click', () => navegar(b.dataset.ir, id)));
    render(filtroAtual);
  }

  // ---------- utilidades de contato ----------
  const fone = (t) => String(t || '').replace(/^(\d{2})(\d{4,5})(\d{4})$/, '($1) $2-$3');
  const zap = (tel, texto) => `https://wa.me/55${String(tel || '').replace(/\D/g, '')}${texto ? `?text=${encodeURIComponent(texto)}` : ''}`;
  const linkReserva = (id) => `${location.origin}/r/${id}`;
  async function copiar(texto, aviso) {
    try { await navigator.clipboard.writeText(texto); toast(aviso || 'Copiado.'); }
    catch { prompt('Copie o texto:', texto); }
  }

  function formPagamento(x, depois) {
    const hoje = new Date(); const p = (n) => String(n).padStart(2, '0');
    const m = modal(`
      <h2>Registrar pagamento</h2>
      <p class="sub">${esc(x.nome_completo)} · poltrona ${esc(x.poltrona ?? '—')} · falta <b>${reais(x.saldo_centavos)}</b></p>
      <p class="sub" style="font-size:.85rem">Use para dinheiro, transferência ou Pix direto na conta da agência. O passageiro vê o valor na página da reserva.</p>
      <form id="f-pag" novalidate style="margin-top:1rem">
        <div class="grid2">
          <div class="campo" data-campo="valor_centavos"><label>Valor recebido</label><div class="moeda"><span>R$</span><input type="text" inputmode="decimal" name="valor" value="${paraMoeda(x.saldo_centavos)}"></div><div class="msg"></div></div>
          <div class="campo" data-campo="recebido_em"><label>Quando recebeu</label><input type="date" name="data" value="${hoje.getFullYear()}-${p(hoje.getMonth() + 1)}-${p(hoje.getDate())}" style="border:1px solid var(--linha);border-radius:10px;padding:.55rem .7rem;width:100%"><div class="msg"></div></div>
        </div>
        <div class="campo"><label>Observação (opcional)</label><input type="text" name="obs" maxlength="200" placeholder="Ex.: dinheiro no escritório"></div>
        <div class="acoes" style="justify-content:flex-end"><button class="btn btn-borda" type="button" data-fechar-modal>Cancelar</button><button class="btn btn-sol" type="submit">Registrar</button></div>
      </form>`);
    $('#f-pag', m).addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const r = await api(`/reservas/${x.id}/pagamento-manual`, { method: 'POST', body: JSON.stringify({
        valor_centavos: centavos(f.valor.value), recebido_em: f.data.value ? new Date(`${f.data.value}T12:00:00`).toISOString() : '', observacao: f.obs.value,
      }) });
      if (!r.json.ok) { errosCampos(f, r.json.erro?.campos); return toast(r.json.erro?.mensagem || 'Erro', true); }
      m.remove();
      toast(r.json.data.saldo_centavos ? `Registrado. Ainda falta ${reais(r.json.data.saldo_centavos)}.` : 'Registrado. Reserva quitada!');
      depois();
    });
  }

  // ---------- lista de embarque ----------
  async function telaEmbarque(id) {
    const c = $('#conteudo');
    c.innerHTML = '<p class="vazio">Carregando…</p>';
    const [rv, rr] = await Promise.all([api(`/viagens/${encodeURIComponent(id)}`), api(`/viagens/${encodeURIComponent(id)}/reservas`)]);
    if (!rv.json.ok) return toast(rv.json.erro?.mensagem || 'Erro', true);
    const v = rv.json.data;
    const conf = (rr.json.data || []).filter((x) => x.status === 'CONFIRMADO');
    const pontos = v.pontos_embarque || [];
    const grupos = pontos.map((p) => ({ nome: p.nome, horario: p.horario, endereco: p.endereco, itens: conf.filter((x) => x.ponto_embarque_id === p.id) }));
    const semPonto = conf.filter((x) => !pontos.some((p) => p.id === x.ponto_embarque_id));
    if (semPonto.length) grupos.push({ nome: pontos.length ? 'Sem ponto definido / ponto removido' : (v.local_embarque || 'Embarque'), horario: pontos.length ? null : v.data_partida, endereco: '', itens: semPonto });
    const ordenar = (a, b) => (a.poltrona ?? 999) - (b.poltrona ?? 999) || a.nome_completo.localeCompare(b.nome_completo);
    grupos.forEach((g) => g.itens.sort(ordenar));
    const tabela = (g, impressao) => `<table><thead><tr><th>${impressao ? '✓' : ''}</th><th>Pol.</th><th>Passageiro</th><th>Telefone</th><th>A receber no embarque</th></tr></thead><tbody>
      ${g.itens.map((x) => `<tr><td style="width:28px">${impressao ? '☐' : ''}</td><td class="num"><b>${esc(x.poltrona ?? '—')}</b></td><td>${esc(x.nome_completo)}${x.desistencia_em ? ' <small>(pediu desistência)</small>' : ''}</td>
        <td class="num">${esc(fone(x.telefone))}</td><td class="num">${x.saldo_centavos ? `<b>${reais(x.saldo_centavos)}</b>` : 'Quitada'}</td></tr>`).join('') || '<tr><td colspan="5">Ninguém neste ponto.</td></tr>'}
      </tbody></table>`;
    c.innerHTML = `
      <button class="voltar" type="button" id="voltar">← Reservas</button>
      <div class="cabeca"><div><h1>Lista de embarque</h1><p class="sub">${esc(v.titulo)} · saída ${dataHora(v.data_partida)} · ${conf.length} passageiro(s) confirmado(s)</p></div>
        <button class="btn btn-noite" type="button" id="imprimir">Imprimir para o motorista</button></div>
      ${grupos.length ? grupos.map((g) => `<div class="cartao grupo-embarque tabela-wrap">
        <h2><span>${esc(g.nome)}${g.endereco ? `<small style="display:block;font-family:var(--texto);font-size:.82rem;color:var(--tinta-2);font-weight:400">${esc(g.endereco)}</small>` : ''}</span><span class="num">${g.horario ? esc(dataHora(g.horario)) : ''} · ${g.itens.length}</span></h2>
        ${tabela(g, false)}</div>`).join('') : '<p class="vazio">Ainda não há passageiros confirmados.</p>'}`;
    $('#voltar').addEventListener('click', () => navegar('reservas', id));
    $('#imprimir').addEventListener('click', () => {
      const w = window.open('', '_blank');
      if (!w) return toast('Permita pop-ups para imprimir.', true);
      w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Embarque — ${esc(v.titulo)}</title>
        <style>body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;margin:14mm}h1{font-size:14pt;margin:0 0 2mm}h2{font-size:12pt;margin:7mm 0 2mm}
        table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:1.6mm 2mm;text-align:left}th{background:#eee;font-size:9.5pt}
        @page{size:A4;margin:10mm}@media print{body{margin:0}}</style></head><body>
        <h1>LISTA DE EMBARQUE — ${esc(v.titulo)}</h1>
        <div>Saída: ${esc(dataHora(v.data_partida))} · Veículo: ${esc(v.veiculo_descricao || '________________')} · Motorista: ${esc(v.motorista_nome || '________________')} · ${conf.length} passageiro(s)</div>
        ${grupos.map((g) => `<h2>${esc(g.nome)}${g.horario ? ` — ${esc(dataHora(g.horario))}` : ''} (${g.itens.length})</h2>${tabela(g, true)}`).join('')}
        <script>window.onload=()=>window.print()<\/script></body></html>`);
      w.document.close();
    });
  }

  // ---------- mensagens no WhatsApp (fila) ----------
  const TIPOS_MSG = {
    LINK: { nome: 'Link da reserva', desc: 'A página onde o passageiro acompanha pagamento, poltrona e embarque.' },
    LEMBRETE: { nome: 'Lembrete de embarque', desc: 'Dia, horário, ponto e poltrona. Mande 1 ou 2 dias antes.' },
    MUDANCA: { nome: 'Mudança de embarque', desc: 'Mudou o horário ou o ponto de embarque.' },
    COBRANCA: { nome: 'Cobrança do saldo', desc: 'Só para quem ainda deve. Leva o link para pagar com Pix.' },
  };
  function textoMensagem(tipo, x, v) {
    const nome = x.nome_completo.split(' ')[0];
    const p = (v.pontos_embarque || []).find((q) => q.id === x.ponto_embarque_id);
    const onde = p ? `${p.nome}${p.endereco ? ` (${p.endereco})` : ''}` : (x.ponto_embarque_nome || v.local_embarque || 'local a confirmar');
    const quando = dataHora(p?.horario || v.data_partida);
    const link = linkReserva(x.id);
    const pol = x.poltrona ? ` Sua poltrona é a ${x.poltrona}.` : '';
    if (tipo === 'LINK') return `Olá, ${nome}! Aqui está a página da sua reserva para *${v.titulo}*: ${link}\nPor ela você acompanha pagamento, poltrona e embarque.`;
    if (tipo === 'LEMBRETE') return `Olá, ${nome}! Lembrete da viagem *${v.titulo}*.\nEmbarque: ${quando} em ${onde}.${pol}\nChegue com 15 minutos de antecedência e leve documento com foto.${x.saldo_centavos ? `\nFalta pagar ${reais(x.saldo_centavos)} — dá para pagar pelo Pix aqui: ${link}` : ''}\nBoa viagem!`;
    if (tipo === 'MUDANCA') return `Olá, ${nome}! Atenção: o embarque da viagem *${v.titulo}* mudou.\nNovo embarque: ${quando} em ${onde}.${pol}\nDetalhes: ${link}`;
    return `Olá, ${nome}! Falta ${reais(x.saldo_centavos)} para quitar sua viagem *${v.titulo}* (saída ${dataHora(v.data_partida)}).\nVocê paga pelo Pix aqui: ${link}`;
  }
  async function telaMensagens(id, tipoInicial) {
    const c = $('#conteudo');
    c.innerHTML = '<p class="vazio">Carregando…</p>';
    const [rv, rr] = await Promise.all([api(`/viagens/${encodeURIComponent(id)}`), api(`/viagens/${encodeURIComponent(id)}/reservas`)]);
    if (!rv.json.ok) return toast(rv.json.erro?.mensagem || 'Erro', true);
    const v = rv.json.data;
    const tipo = tipoInicial || estado.tipoMsg || 'LEMBRETE';
    estado.tipoMsg = tipo;
    const fila = (rr.json.data || []).filter((x) => x.status === 'CONFIRMADO' && (tipo !== 'COBRANCA' || x.saldo_centavos > 0))
      .sort((a, b) => (a.poltrona ?? 999) - (b.poltrona ?? 999));
    const feitas = fila.filter((x) => x.mensagens.includes(tipo)).length;
    const exemplo = fila[0] ? textoMensagem(tipo, fila[0], v) : '';
    c.innerHTML = `
      <button class="voltar" type="button" id="voltar">← Reservas</button>
      <div class="cabeca"><div><h1>Mensagens no WhatsApp</h1><p class="sub">${esc(v.titulo)} · abra a conversa de cada passageiro com o texto pronto e toque em enviar.</p></div></div>
      <div class="cartao bloco" style="margin-bottom:16px">
        <div class="radios">${Object.entries(TIPOS_MSG).map(([k, t]) => `<label><input type="radio" name="tipo-msg" value="${k}" ${k === tipo ? 'checked' : ''}> ${t.nome}</label>`).join('')}</div>
        <p class="sub" style="font-size:.88rem;margin-top:.6rem">${esc(TIPOS_MSG[tipo].desc)}</p>
        ${exemplo ? `<div class="msg-previa">${esc(exemplo)}</div>` : ''}
        <div class="acoes">
          <button class="btn btn-sol" type="button" id="proximo" ${feitas >= fila.length ? 'disabled' : ''}>Abrir próximo passageiro (${feitas}/${fila.length})</button>
          <button class="btn btn-borda" type="button" id="recomecar" ${feitas ? '' : 'disabled'}>Recomeçar a fila</button>
        </div>
        <p class="sub" style="font-size:.8rem;margin-top:.6rem">O painel marca a conversa como aberta, mas não tem como saber se a mensagem foi enviada.</p>
      </div>
      <div class="cartao">${fila.length ? `<ul class="fila">${fila.map((x) => `<li class="${x.mensagens.includes(tipo) ? 'feita' : ''}">
        <b class="num" style="width:2.2rem">${esc(x.poltrona ?? '—')}</b><span class="nome">${esc(x.nome_completo)}<br><small style="color:var(--tinta-2)">${esc(fone(x.telefone))}${x.saldo_centavos ? ` · falta ${reais(x.saldo_centavos)}` : ''}</small></span>
        ${x.mensagens.includes(tipo) ? '<span class="pill p-CONFIRMADO">Aberta</span>' : ''}
        <button class="btn btn-borda btn-mini" type="button" data-abrir-msg="${esc(x.id)}">Abrir WhatsApp</button></li>`).join('')}</ul>`
        : '<p class="vazio">Ninguém para receber esta mensagem.</p>'}</div>`;
    $('#voltar').addEventListener('click', () => navegar('reservas', id));
    $$('input[name="tipo-msg"]').forEach((r) => r.addEventListener('change', () => telaMensagens(id, r.value)));
    const abrir = async (x) => {
      window.open(zap(x.telefone, textoMensagem(tipo, x, v)), '_blank', 'noopener');
      await api('/mensagens', { method: 'POST', body: JSON.stringify({ reserva_id: x.id, tipo }) }).catch(() => {});
      telaMensagens(id, tipo);
    };
    $$('[data-abrir-msg]').forEach((b) => b.addEventListener('click', () => abrir(fila.find((x) => x.id === b.dataset.abrirMsg))));
    $('#proximo').addEventListener('click', () => { const x = fila.find((y) => !y.mensagens.includes(tipo)); if (x) abrir(x); });
    $('#recomecar').addEventListener('click', async () => {
      if (!confirm('Todo mundo volta a aparecer como pendente nesta mensagem. Use quando precisar avisar de novo.')) return;
      await api(`/viagens/${encodeURIComponent(id)}/mensagens/${tipo}`, { method: 'DELETE' });
      telaMensagens(id, tipo);
    });
  }

  // ---------- cobranças ----------
  async function telaCobrancas() {
    const c = $('#conteudo');
    c.innerHTML = '<p class="vazio">Carregando…</p>';
    const r = await api('/cobrancas');
    const lista = r.json.data || [];
    const agora = Date.now();
    const total = lista.reduce((s, x) => s + x.saldo_centavos, 0);
    c.innerHTML = `
      <div class="cabeca"><div><h1>Cobranças</h1><p class="sub">Quem ainda precisa pagar o saldo, pela data da viagem. A mensagem leva o link da reserva, onde o passageiro paga com Pix.</p></div></div>
      <div class="valores3"><div class="cartao"><small>A receber</small><strong>${reais(total)}</strong></div><div class="cartao"><small>Passageiros</small><strong>${lista.length}</strong></div>
        <div class="cartao"><small>Saem em até 7 dias</small><strong>${lista.filter((x) => new Date(x.data_partida).getTime() - agora <= 7 * 864e5).length}</strong></div></div>
      <div class="cartao tabela-wrap">${lista.length ? `<table><thead><tr><th>Viagem</th><th>Passageiro</th><th>Pol.</th><th>Falta</th><th>Última cobrança</th><th></th></tr></thead><tbody>
        ${lista.map((x) => { const dias = Math.ceil((new Date(x.data_partida).getTime() - agora) / 864e5); return `<tr>
          <td class="titulo-viagem">${esc(x.titulo)}<small>${dataHora(x.data_partida)} · ${dias < 0 ? 'já saiu' : dias === 0 ? 'hoje' : `em ${dias} dia(s)`}</small></td>
          <td>${esc(x.nome_completo)}<br><small class="num">${esc(fone(x.telefone))}</small>${x.desistencia_em ? ' <span class="pill p-DESIST">Pediu desistência</span>' : ''}</td>
          <td class="num">${esc(x.poltrona ?? '—')}</td>
          <td class="num erro-txt"><b>${reais(x.saldo_centavos)}</b>${x.pix_aguardando ? '<br><small style="color:var(--aviso)">Pix gerado, aguardando</small>' : ''}</td>
          <td class="num">${x.cobrado_em ? dataHora(x.cobrado_em) : '—'}</td>
          <td><div class="acoes"><button class="btn btn-sol btn-mini" data-cobrar="${esc(x.id)}">Cobrar no WhatsApp</button>
            ${pode('pagamentos.registrar') ? `<button class="btn btn-borda btn-mini" data-pagar="${esc(x.id)}">Registrar pagamento</button>` : ''}</div></td>
        </tr>`; }).join('')}</tbody></table>` : '<p class="vazio">Ninguém devendo. 🎉</p>'}</div>`;
    $$('[data-cobrar]').forEach((b) => b.addEventListener('click', async () => {
      const x = lista.find((y) => y.id === b.dataset.cobrar);
      const texto = `Olá, ${x.nome_completo.split(' ')[0]}! Falta ${reais(x.saldo_centavos)} para quitar sua viagem *${x.titulo}* (saída ${dataHora(x.data_partida)}).\nVocê paga pelo Pix aqui: ${linkReserva(x.id)}`;
      window.open(zap(x.telefone, texto), '_blank', 'noopener');
      await api('/mensagens', { method: 'POST', body: JSON.stringify({ reserva_id: x.id, tipo: 'COBRANCA' }) }).catch(() => {});
      telaCobrancas();
    }));
    $$('[data-pagar]').forEach((b) => b.addEventListener('click', () => formPagamento({ ...lista.find((y) => y.id === b.dataset.pagar) }, telaCobrancas)));
  }

  // ---------- financeiro da viagem ----------
  const CATEGORIAS = { FRETAMENTO: 'Fretamento do ônibus', HOSPEDAGEM: 'Hospedagem', ALIMENTACAO: 'Alimentação', PASSEIOS: 'Passeios e ingressos', GUIA: 'Guia', SEGURO: 'Seguro', TAXAS: 'Taxas e licenças', OUTROS: 'Outros' };
  async function telaFinanceiro(id) {
    const c = $('#conteudo');
    c.innerHTML = '<p class="vazio">Carregando…</p>';
    const r = await api(`/viagens/${encodeURIComponent(id)}/financeiro`);
    if (!r.json.ok) return toast(r.json.erro?.mensagem || 'Erro', true);
    const f = r.json.data;
    const pagou = f.resultado >= 0;
    c.innerHTML = `
      <button class="voltar" type="button" id="voltar">← Reservas</button>
      <div class="cabeca"><div><h1>Financeiro</h1><p class="sub">${esc(f.viagem.titulo)} · ${f.confirmadas} passageiro(s) confirmado(s)</p></div></div>
      <div class="valores3">
        <div class="cartao"><small>Recebido</small><strong>${reais(f.recebido)}</strong></div>
        <div class="cartao"><small>A receber</small><strong>${reais(f.a_receber)}</strong></div>
        <div class="cartao"><small>Despesas</small><strong>${reais(f.total_despesas)}</strong></div>
        <div class="cartao"><small>Já se pagou?</small><strong class="${pagou ? 'ok-txt' : 'erro-txt'}">${pagou ? `Sim, sobra ${reais(f.resultado)}` : `Faltam ${reais(-f.resultado)}`}</strong></div>
        <div class="cartao"><small>Resultado previsto</small><strong>${reais(f.resultado_previsto)}</strong><small style="text-transform:none;letter-spacing:0;font-weight:400">se todos pagarem o saldo</small></div>
      </div>
      ${f.a_estornar ? `<div class="aviso-box">${reais(f.a_estornar)} desta viagem estão em <b>Pendências</b> para estornar e não entram no recebido.</div>` : ''}
      <div class="cartao bloco">
        <h2>Despesas</h2>
        ${pode('despesas.editar') ? `<form id="f-desp" novalidate class="filtros" style="align-items:flex-start">
          <div class="campo" data-campo="categoria" style="margin:0"><select name="categoria">${Object.entries(CATEGORIAS).map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select><div class="msg"></div></div>
          <div class="campo" data-campo="descricao" style="margin:0;flex:1;min-width:180px"><input type="text" name="descricao" placeholder="Descrição (ex.: Ônibus Viação X)" maxlength="160"><div class="msg"></div></div>
          <div class="campo" data-campo="valor_centavos" style="margin:0;width:140px"><div class="moeda"><span>R$</span><input type="text" inputmode="decimal" name="valor" placeholder="0,00"></div><div class="msg"></div></div>
          <button class="btn btn-sol" type="submit">Lançar</button>
        </form>` : ''}
        ${f.despesas.length ? `<div class="tabela-wrap"><table><thead><tr><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Lançada por</th><th></th></tr></thead><tbody>
          ${f.despesas.map((d) => `<tr><td>${esc(CATEGORIAS[d.categoria] || d.categoria)}</td><td>${esc(d.descricao)}</td><td class="num">${reais(d.valor_centavos)}</td>
            <td><small>${esc(d.criado_por || '')} · ${dataCurta(d.criado_em)}</small></td>
            <td>${pode('despesas.editar') ? `<button class="btn btn-perigo btn-mini" data-apagar-desp="${esc(d.id)}">Apagar</button>` : ''}</td></tr>`).join('')}
        </tbody></table></div>` : '<p class="vazio">Nenhuma despesa lançada.</p>'}
      </div>`;
    $('#voltar').addEventListener('click', () => navegar('reservas', id));
    $('#f-desp')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fm = e.target;
      const res = await api(`/viagens/${encodeURIComponent(id)}/despesas`, { method: 'POST', body: JSON.stringify({ categoria: fm.categoria.value, descricao: fm.descricao.value, valor_centavos: centavos(fm.valor.value) }) });
      if (!res.json.ok) { errosCampos(fm, res.json.erro?.campos); return toast(res.json.erro?.mensagem || 'Erro', true); }
      toast('Despesa lançada.'); telaFinanceiro(id);
    });
    $$('[data-apagar-desp]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('Apagar esta despesa?')) return;
      const res = await api(`/despesas/${b.dataset.apagarDesp}`, { method: 'DELETE' });
      if (!res.json.ok) return toast(res.json.erro?.mensagem || 'Erro', true);
      telaFinanceiro(id);

  // ---------- manifesto ANTT / DER ----------
  const COLUNAS = {
    ordem: 'Nº', poltrona: 'Poltrona', nome: 'Nome completo', rg: 'RG', orgao_emissor: 'Órgão emissor', cpf: 'CPF', telefone: 'Telefone', embarque: 'Embarque', status: 'Situação', codigo: 'Código',
  };
  const MODELOS = {
    antt: { nome: 'ANTT (interestadual)', colunas: ['ordem', 'poltrona', 'nome', 'rg', 'orgao_emissor', 'cpf'] },
    der: { nome: 'DER (intermunicipal)', colunas: ['ordem', 'poltrona', 'nome', 'rg', 'orgao_emissor', 'cpf', 'telefone'] },
    onibus: { nome: 'Empresa do ônibus (licença de viagem)', colunas: ['poltrona', 'nome', 'rg', 'cpf', 'embarque'] },
    interno: { nome: 'Conferência interna', colunas: ['ordem', 'poltrona', 'nome', 'cpf', 'telefone', 'embarque', 'status', 'codigo'] },
  };

  async function telaManifesto(id) {
    const c = $('#conteudo');
    c.innerHTML = `
      <button class="voltar" type="button" id="voltar">← Viagens</button>
      <div class="cabeca"><div><h1>Lista de passageiros</h1><p class="sub" id="m-viagem">Carregando…</p></div></div>
      <div class="aviso-box">Contém CPF e RG completos. O acesso fica registrado. Confira o leiaute exigido pelo órgão (ANTT ou DER do seu estado) antes de enviar — as colunas abaixo podem ser ajustadas.</div>
      <div class="cartao bloco" style="margin-bottom:16px">
        <div class="filtros">
          <label>Modelo <select id="m-modelo">${Object.entries(MODELOS).map(([k, m]) => `<option value="${k}">${m.nome}</option>`).join('')}</select></label>
          <label>Passageiros <select id="m-status"><option value="CONFIRMADO">Somente confirmados</option><option value="TODOS">Todos (inclui pendentes/cancelados)</option></select></label>
        </div>
        <div class="colunas" id="m-colunas">${Object.entries(COLUNAS).map(([k, n]) => `<label><input type="checkbox" value="${k}"> ${n}</label>`).join('')}</div>
        <div class="acoes">
          <button class="btn btn-sol" type="button" id="m-csv">Baixar planilha (CSV)</button>
          <button class="btn btn-noite" type="button" id="m-imprimir">Imprimir / salvar PDF</button>
        </div>
      </div>
      <div class="cartao tabela-wrap" id="m-previa"></div>`;
    $('#voltar').addEventListener('click', () => navegar('viagens'));

    let dados = null;
    const colunasSel = () => $$('#m-colunas input:checked').map((i) => i.value);
    const aplicarModelo = () => { const cols = MODELOS[$('#m-modelo').value].colunas; $$('#m-colunas input').forEach((i) => (i.checked = cols.includes(i.value))); previa(); };
    const valor = (p, k) => k === 'status' ? ({ CONFIRMADO: 'Confirmado', PENDENTE: 'Pendente', EXPIRADO: 'Expirado', CANCELADO: 'Cancelado' }[p.status] || p.status) : p[k];

    async function carregar() {
      $('#m-previa').innerHTML = '<p class="vazio">Carregando…</p>';
      const r = await api(`/passageiros/${encodeURIComponent(id)}?status=${$('#m-status').value}`);
      if (!r.json.ok) return toast(r.json.erro?.mensagem || 'Erro', true);
      dados = r.json.data;
      // renumera após o filtro
      dados.passageiros.forEach((p, i) => (p.ordem = i + 1));
      $('#m-viagem').textContent = `${dados.viagem.titulo} · partida ${dataHora(dados.viagem.data_partida)} · ${dados.passageiros.length} passageiro(s)`;
      previa();
    }
    function previa() {
      if (!dados) return;
      const cols = colunasSel();
      $('#m-previa').innerHTML = dados.passageiros.length
        ? `<table><thead><tr>${cols.map((k) => `<th>${COLUNAS[k]}</th>`).join('')}</tr></thead><tbody>${dados.passageiros.map((p) => `<tr>${cols.map((k) => `<td>${esc(valor(p, k))}</td>`).join('')}</tr>`).join('')}</tbody></table>`
        : '<p class="vazio">Nenhum passageiro neste filtro.</p>';
    }
    $('#m-modelo').addEventListener('change', aplicarModelo);
    $('#m-status').addEventListener('change', carregar);
    $('#m-colunas').addEventListener('change', previa);

    $('#m-csv').addEventListener('click', () => {
      if (!dados) return;
      const cols = colunasSel();
      const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
      const linhas = [cols.map((k) => q(COLUNAS[k])).join(';'), ...dados.passageiros.map((p) => cols.map((k) => q(valor(p, k))).join(';'))];
      const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `lista-${$('#m-modelo').value}-${id}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });

    $('#m-imprimir').addEventListener('click', () => {
      if (!dados) return;
      const cols = colunasSel();
      const modelo = MODELOS[$('#m-modelo').value].nome;
      const v = dados.viagem;
      const w = window.open('', '_blank');
      if (!w) return toast('Permita pop-ups para imprimir.', true);
      w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Lista de passageiros — ${esc(v.titulo)}</title>
        <style>body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#000;margin:18mm}h1{font-size:14pt;margin:0 0 4mm}
        .cab{display:grid;grid-template-columns:1fr 1fr;gap:2mm 8mm;margin-bottom:6mm;font-size:10pt}.cab b{display:inline-block;min-width:32mm}
        table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:2mm 2.5mm;text-align:left}th{background:#eee;font-size:9.5pt}
        .ass{margin-top:18mm;display:grid;grid-template-columns:1fr 1fr;gap:16mm}.ass div{border-top:1px solid #000;padding-top:2mm;text-align:center;font-size:9.5pt}
        @page{size:A4;margin:12mm}@media print{body{margin:0}}</style></head><body>
        <h1>RELAÇÃO DE PASSAGEIROS — ${esc(modelo.toUpperCase())}</h1>
        <div class="cab">
          <div><b>Empresa:</b> ${esc(estado.agencia || 'Expresso Apollo Turismo')}</div><div><b>Emitida em:</b> ${esc(dataHora(new Date().toISOString()))}</div>
          <div><b>Viagem:</b> ${esc(v.titulo)}</div><div><b>Destino:</b> ${esc(v.destino)}</div>
          <div><b>Partida:</b> ${esc(dataHora(v.data_partida))}</div><div><b>Retorno:</b> ${esc(dataHora(v.data_retorno))}</div>
          <div><b>Embarque:</b> ${esc(v.local_embarque || '—')}</div><div><b>Passageiros:</b> ${dados.passageiros.length} de ${v.total_vagas} lugares</div>
          <div><b>Veículo/placa:</b> ${esc(v.veiculo_descricao || '______________________')}</div><div><b>Motorista(s):</b> ${esc(v.motorista_nome || '______________________')}</div>
        </div>
        <table><thead><tr>${cols.map((k) => `<th>${COLUNAS[k]}</th>`).join('')}</tr></thead>
        <tbody>${dados.passageiros.map((p) => `<tr>${cols.map((k) => `<td>${esc(valor(p, k))}</td>`).join('')}</tr>`).join('')}</tbody></table>
        <div class="ass"><div>Responsável pela empresa</div><div>Motorista</div></div>
        <script>window.onload=()=>window.print()<\/script></body></html>`);
      w.document.close();
    });

    aplicarModelo();
    carregar();
  }

  // ---------- pendências ----------

    const c = $('#conteudo');
    c.innerHTML = '<p class="vazio">Carregando…</p>';
    const r = await api('/pendencias');
    const lista = r.json.data || [];
    atualizarBadge();
    c.innerHTML = `
      <div class="cabeca"><div><h1>Pendências financeiras</h1><p class="sub">Pix pagos sem vaga (pagamento após o prazo), valores divergentes e reservas pagas canceladas. Faça o estorno no app do gateway e marque aqui.</p></div></div>
      <div class="cartao tabela-wrap">${lista.length ? `<table><thead><tr><th>Situação</th><th>Viagem</th><th>Passageiro</th><th>Valor</th><th>Pix (gateway)</th><th>Motivo</th><th>Atualizado</th><th></th></tr></thead><tbody>
        ${lista.map((x) => `<tr>
          <td><span class="pill p-${esc(x.status_interno)}">${x.status_interno === 'ESTORNAR' ? 'Estornar' : 'Divergente'}</span></td>
          <td>${esc(x.titulo)}<br><small><code>${esc(x.codigo)}</code></small></td>

    $$('[data-estornado]').forEach((b) => b.addEventListener('click', async () => {

  // ---------- usuários (master) ----------
  async function telaUsuarios() {
    const c = $('#conteudo');
    c.innerHTML = '<p class="vazio">Carregando…</p>';
    const r = await api('/usuarios');
    if (!r.json.ok) { c.innerHTML = `<p class="vazio">${esc(r.json.erro?.mensagem || 'Sem acesso')}</p>`; return; }
    const lista = r.json.data, cat = r.json.catalogo;
    c.innerHTML = `
      <div class="cabeca"><div><h1>Usuários e permissões</h1><p class="sub">Só o master cria usuários e define o que cada um pode fazer. Usuários novos trocam a senha no primeiro acesso.</p></div>

      <div class="cartao tabela-wrap"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Papel</th><th>Permissões</th><th>Último acesso</th><th>Situação</th><th></th></tr></thead><tbody>
      ${lista.map((u) => `<tr>
        <td class="titulo-viagem">${esc(u.nome)}</td><td><code>${esc(u.usuario)}</code></td>
        <td><span class="pill p-${u.papel}">${u.papel === 'MASTER' ? 'Master' : 'Operador'}</span></td>
