        <td class="num">${u.ultimo_login_em ? dataHora(u.ultimo_login_em) : 'Nunca'}</td>
        <td>${u.bloqueado_ate && u.bloqueado_ate > new Date().toISOString() ? '<span class="pill p-ESTORNAR">Bloqueado</span>' : `<span class="pill ${u.ativo ? 'p-ativa' : 'p-inativa'}">${u.ativo ? 'Ativo' : 'Desativado'}</span>`}${u.trocar_senha ? ' <span class="pill p-PENDENTE">Trocar senha</span>' : ''}</td>
        <td>${u.papel === 'MASTER' ? '' : `<div class="acoes"><button class="btn btn-borda btn-mini" data-editar-u="${esc(u.id)}">Editar</button><button class="btn btn-borda btn-mini" data-senha-u="${esc(u.id)}">Redefinir senha</button></div>`}</td>
      </tr>`).join('')}</tbody></table></div>`;
    $('#novo-usuario').addEventListener('click', () => formUsuario(null, cat));
    $$('[data-editar-u]').forEach((b) => b.addEventListener('click', () => formUsuario(lista.find((u) => u.id === b.dataset.editarU), cat)));
    $$('[data-senha-u]').forEach((b) => b.addEventListener('click', () => formRedefinir(lista.find((u) => u.id === b.dataset.senhaU))));
  }

  function modal(html) {
    const fundo = document.createElement('div');
    fundo.className = 'modal-fundo';
    fundo.innerHTML = `<div class="cartao" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(fundo);
    fundo.addEventListener('click', (e) => { if (e.target === fundo || e.target.closest('[data-fechar-modal]')) fundo.remove(); });
    const primeiro = fundo.querySelector('input:not([disabled])'); if (primeiro) primeiro.focus();
    return fundo;
  }
  function errosCampos(raiz, campos = {}) {
    $$('[data-campo]', raiz).forEach((el) => { const m = campos[el.dataset.campo]; if (m) { el.setAttribute('data-erro', ''); $('.msg', el).textContent = m; } else el.removeAttribute('data-erro'); });
  }

  function formUsuario(u, cat) {
    const novo = !u;
    const m = modal(`
      <h2>${novo ? 'Novo usuário' : 'Editar ' + esc(u.nome)}</h2>
      <form id="f-usuario" novalidate style="margin-top:1rem">
        <div class="campo" data-campo="nome"><label>Nome</label><input type="text" name="nome" value="${esc(u?.nome || '')}" maxlength="80"><div class="msg"></div></div>
        <div class="campo" data-campo="usuario"><label>Usuário (login)</label><input type="text" name="usuario" value="${esc(u?.usuario || '')}" ${novo ? '' : 'disabled'} autocapitalize="none" spellcheck="false" placeholder="ex.: maria.vendas"><div class="msg"></div></div>
        ${novo ? `<div class="campo" data-campo="senha"><label>Senha provisória</label><input type="text" name="senha" autocomplete="new-password" placeholder="mín. 10 caracteres, letras e números"><div class="ajuda">O usuário será obrigado a trocar no primeiro acesso.</div><div class="msg"></div></div>` : ''}
        <label style="font-weight:600;font-size:.88rem">Permissões</label>
        <div class="perms">${Object.entries(cat).map(([k, d]) => `<label><input type="checkbox" name="perm" value="${k}" ${u?.permissoes?.includes(k) ? 'checked' : ''}><span>${esc(d)}<code>${k}</code></span></label>`).join('')}</div>
        <div class="campo" data-campo="permissoes"><div class="msg"></div></div>
        ${novo ? '' : `<label class="toggle" style="margin-bottom:1rem"><input type="checkbox" name="ativo" ${u.ativo ? 'checked' : ''}> Usuário ativo (desmarcar encerra as sessões dele)</label>`}
        <div class="acoes" style="justify-content:flex-end"><button class="btn btn-borda" type="button" data-fechar-modal>Cancelar</button><button class="btn btn-sol" type="submit">${novo ? 'Criar usuário' : 'Salvar'}</button></div>
      </form>`);
    $('#f-usuario', m).addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const corpo = { nome: f.nome.value, permissoes: $$('input[name="perm"]:checked', f).map((i) => i.value) };
      if (novo) Object.assign(corpo, { usuario: f.usuario.value, senha: f.senha.value }); else corpo.ativo = f.ativo.checked;
      const r = await api(novo ? '/usuarios' : `/usuarios/${u.id}`, { method: novo ? 'POST' : 'PUT', body: JSON.stringify(corpo) });
      if (!r.json.ok) { errosCampos(f, r.json.erro?.campos); return toast(r.json.erro?.mensagem || 'Erro', true); }
      m.remove(); toast(novo ? 'Usuário criado. Passe o login e a senha provisória para ele.' : 'Usuário atualizado.'); telaUsuarios();
    });
  }

  function formRedefinir(u) {
    const m = modal(`
      <h2>Redefinir senha de ${esc(u.nome)}</h2>
      <p class="sub">As sessões abertas dele serão encerradas e ele terá de trocar a senha ao entrar.</p>
      <form id="f-redef" novalidate style="margin-top:1rem">
        <div class="campo" data-campo="senha"><label>Nova senha provisória</label><input type="text" name="senha" autocomplete="new-password"><div class="msg"></div></div>
        <div class="acoes" style="justify-content:flex-end"><button class="btn btn-borda" type="button" data-fechar-modal>Cancelar</button><button class="btn btn-sol" type="submit">Redefinir</button></div>
      </form>`);
    $('#f-redef', m).addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await api(`/usuarios/${u.id}/senha`, { method: 'POST', body: JSON.stringify({ senha: e.target.senha.value }) });
      if (!r.json.ok) { errosCampos(e.target, r.json.erro?.campos); return toast(r.json.erro?.mensagem || 'Erro', true); }
      m.remove(); toast('Senha redefinida.'); telaUsuarios();
    });
  }

        <p class="sub">${obrigatoria ? 'Por segurança, defina uma senha pessoal antes de continuar.' : `Conectado como <b>${esc(estado.me?.usuario || '')}</b>. Trocar a senha encerra suas sessões em outros aparelhos.`}</p>
        <form class="cartao bloco" id="f-senha" novalidate style="margin-top:1rem">
          <div class="campo" data-campo="senha_atual"><label>Senha atual${obrigatoria ? ' (provisória)' : ''}</label><input type="password" name="senha_atual" autocomplete="current-password"><div class="msg"></div></div>
          <div class="campo" data-campo="nova_senha"><label>Nova senha</label><input type="password" name="nova_senha" autocomplete="new-password"><div class="ajuda">Mínimo 10 caracteres, com letras e números.</div><div class="msg"></div></div>
          <div class="campo" data-campo="confirma"><label>Repita a nova senha</label><input type="password" name="confirma" autocomplete="new-password"><div class="msg"></div></div>
          <button class="btn btn-sol" type="submit">Salvar nova senha</button>
        </form>
      </div>`;
    $('#voltar')?.addEventListener('click', () => navegar('viagens'));
    $('#f-senha').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      if (f.nova_senha.value !== f.confirma.value) return errosCampos(f, { confirma: 'As senhas não conferem' });
      const r = await api('/me/senha', { method: 'POST', body: JSON.stringify({ senha_atual: f.senha_atual.value, nova_senha: f.nova_senha.value }) });
      if (!r.json.ok) { errosCampos(f, r.json.erro?.campos); return toast(r.json.erro?.mensagem || 'Erro', true); }
      toast('Senha alterada.');
      if (estado.me) estado.me.trocar_senha = false;
      entrarNoApp();
    });
  }

  // ---------- auditoria ----------
  const ACOES = {
    login: 'Entrou no painel', logout: 'Saiu', login_falhou: 'Tentativa de login falhou', login_usuario_inativo: 'Login de usuário desativado',
    master_criado: 'Master criado', senha_alterada: 'Trocou a própria senha', senha_redefinida: 'Redefiniu senha de usuário',
    usuario_criado: 'Criou usuário', usuario_alterado: 'Alterou usuário/permissões', viagem_criada: 'Criou viagem',
    viagem_alterada: 'Alterou viagem', preco_alterado: 'Alterou preço', reserva_cancelada: 'Cancelou reserva',
    manifesto_exportado: 'Gerou lista de passageiros', estorno_registrado: 'Registrou estorno',
    viagem_duplicada: 'Duplicou viagem', viagem_cancelada: 'Cancelou viagem', viagem_concluida: 'Concluiu viagem',
    pagamento_manual: 'Registrou pagamento à mão', desistencia_aprovada: 'Aprovou desistência', desistencia_recusada: 'Recusou desistência',
    despesa_lancada: 'Lançou despesa', despesa_apagada: 'Apagou despesa', foto_enviada: 'Enviou foto',
  };
  function descreverDetalhe(a) {
    const d = a.detalhe; if (!d) return '';
    const partes = [];
    if (d.sinal) partes.push(`sinal ${reais(d.sinal[0])} → ${reais(d.sinal[1])}`);
    if (d.integral) partes.push(`integral ${reais(d.integral[0])} → ${reais(d.integral[1])}`);
    if (d.vagas) partes.push(Array.isArray(d.vagas) ? `vagas ${d.vagas[0]} → ${d.vagas[1]}` : `${d.vagas} vagas`);
    if (d.a_venda !== undefined) partes.push(d.a_venda ? 'colocada à venda' : 'venda pausada');
    if (d.usuario && a.acao !== 'login_falhou') partes.push(`usuário ${d.usuario}`);
    if (d.usuario && a.acao === 'login_falhou') partes.push(`tentou "${d.usuario}"`);
    if (d.permissoes_depois) partes.push(`permissões: ${d.permissoes_depois.join(', ') || 'nenhuma'}`);
    if (d.permissoes && !d.permissoes_depois) partes.push(`permissões: ${d.permissoes.join(', ') || 'nenhuma'}`);
    if (d.ativo !== undefined) partes.push(d.ativo ? 'reativado' : 'desativado');
    if (d.quantidade !== undefined) partes.push(`${d.quantidade} passageiro(s), ${d.formato}`);
    if (d.codigo) partes.push(`reserva ${d.codigo}${d.estornar ? ' (estornar)' : ''}`);
    if (d.bloqueado) partes.push('usuário bloqueado por 15 min');
    if (d.valor) partes.push(reais(d.valor));
    if (d.categoria) partes.push(d.categoria.toLowerCase());
    if (d.reservas !== undefined) partes.push(`${d.reservas} reserva(s) cancelada(s), ${d.estornos} estorno(s)`);
    if (d.origem) partes.push(`cópia de ${d.origem}`);
    if (d.situacao) partes.push(d.situacao.toLowerCase());
    if (d.embarque_alterado) partes.push('pontos de embarque alterados');
    return partes.join(' · ');
  }
  async function telaAuditoria() {
    const c = $('#conteudo');
    c.innerHTML = '<p class="vazio">Carregando…</p>';
    const r = await api('/auditoria?limite=300');
    const lista = r.json.data || [];
    c.innerHTML = `
      <div class="cabeca"><div><h1>Registro de atividades</h1><p class="sub">Últimas 300 ações no painel: acessos, mudanças de preço, cancelamentos, listas geradas e permissões.</p></div></div>
      <div class="cartao tabela-wrap">${lista.length ? `<table><thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Detalhes</th><th>IP</th></tr></thead><tbody>
      ${lista.map((a) => `<tr><td class="num">${dataHora(a.criado_em)}</td><td>${esc(a.usuario || '—')}</td><td>${esc(ACOES[a.acao] || a.acao)}</td>
        <td><small>${esc(descreverDetalhe(a))}${a.alvo && !a.detalhe && !/^[0-9a-f-]{36}$/.test(a.alvo) ? `<code>${esc(a.alvo)}</code>` : ''}</small></td><td><small>${esc(a.ip || '')}</small></td></tr>`).join('')}
      </tbody></table>` : '<p class="vazio">Nenhuma atividade registrada.</p>'}</div>`;
  }

  // ---------- início ----------
  if (sess.get()) entrarNoApp().catch(() => {});
  else mostrarLogin();
})();
</script>
</body>
</html>
